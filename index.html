<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compuerta Parcialmente Sumergida (LearnChemE)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f7; }
        .navbar { background-color: #2c3e50; padding: 15px; text-align: center; }
        .navbar a { color: #f1c40f; text-decoration: none; font-weight: bold; padding: 8px 16px; border: 2px solid #f1c40f; border-radius: 5px; }
        header { background-color: #34495e; color: white; padding: 20px; text-align: center; }
        h1 { margin: 0; font-size: 24px; }
        .container { display: flex; flex-wrap: wrap; max-width: 1200px; margin: 20px auto; gap: 20px; padding: 0 15px; }
        .controls-panel { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .canvas-container { flex: 2; min-width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 500px; position: relative; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        .control-group input[type="range"] { width: 100%; cursor: pointer; }
        .results-panel { background-color: #e8f4f8; padding: 15px; border-radius: 8px; margin-top: 20px; border-left: 4px solid #3498db; }
        .result-item { margin-bottom: 10px; font-size: 16px; color: #34495e; }
        .result-item strong { color: #e74c3c; font-size: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="index.html">🕹️ Caso 1: Parcialmente Sumergida (Cable Superior)</a>
    </div>

    <header>
        <h1>Fuerzas en una Compuerta Parcialmente Sumergida</h1>
        <p style="margin-top: 5px; opacity: 0.8;">Modelo LearnChemE: Bisagra inferior y tensión horizontal</p>
    </header>

    <main class="container">
        <section class="controls-panel">
            <h2 style="margin-top:0; color:#2c3e50; border-bottom:2px solid #eee; padding-bottom:10px;">Parámetros</h2>
            
            <div class="control-group" style="background-color: #fdf2e9; padding: 10px; border-radius: 4px; border-left: 4px solid #e67e22;">
                <label style="margin-bottom: 0;">Longitud de la compuerta, L: <strong>4.00</strong> m</label>
            </div>

            <div class="control-group" style="margin-top: 15px;">
                <label>Profundidad del agua (h): <span id="d-val">2.00</span> m</label>
                <input type="range" id="d-slider" min="0.00" max="4.00" step="0.01" value="2.00">
            </div>

            <div class="control-group">
                <label>Ancho de la compuerta, b: <span id="b-val">1.50</span> m</label>
                <input type="range" id="b-slider" min="0.50" max="3.00" step="0.01" value="1.50">
            </div>

            <div class="control-group">
                <label>Ángulo de la compuerta, &theta;: <span id="theta-val">60</span>&deg;</label>
                <input type="range" id="theta-slider" min="20" max="80" step="1" value="60">
            </div>

            <div class="control-group">
                <label>Peso de la compuerta, W: <span id="w-val">15.0</span> kN</label>
                <input type="range" id="w-slider" min="0.0" max="40.0" step="0.1" value="15.0">
            </div>

            <div class="control-group">
                <label>Densidad Relativa (DR): <span id="dr-val">1.00</span></label>
                <input type="range" id="dr-slider" min="0.50" max="3.00" step="0.01" value="1.00">
            </div>

            <div class="results-panel">
                <h2 style="margin-top:0; font-size:18px;">Resultados</h2>
                <div class="result-item">Fuerza del Agua (F<sub>R</sub>): <strong id="fr-out">0.00</strong> kN</div>
                <div class="result-item">Centro de Presión (desde la base): <strong id="cp-out">0.00</strong> m</div>
                <div class="result-item">Tensión del cable (T): <strong id="t-out">0.00</strong> kN</div>
            </div>
        </section>

        <section class="canvas-container" id="canvas-container"></section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
